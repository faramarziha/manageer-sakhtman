name: building_manager
description: "اپلیکیشن مدیریت ساختمان - مدیریت واحدها، شارژ، اعلانات و درخواست‌ها"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: 6.1.5+1
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: 2.5.3
  http: 1.5.0
  shamsi_date: ^1.0.4
  persian_tools: ^1.0.3
  # اشتراک‌گذاری رایگان قبوض در پیام‌رسان‌ها (حذف کامل هزینه پیامک)
  share_plus: ^11.0.0
  # خروجی بیلان مالی PDF ممهور به مهر هیئت‌مدیره
  pdf: ^3.11.0
  printing: ^5.13.0
  # خروجی بیلان مالی در قالب اکسل
  excel: ^4.0.6
  # فشرده‌سازی تصاویر فاکتور در سمت کلاینت (کاهش ترافیک سرور)
  image: ^4.3.0
  image_picker: ^1.1.2
  # باز کردن لینک درگاه پرداخت شاپرک
  url_launcher: ^6.3.1
  # نمودار دایره‌ای شفافیت مالی هزینه‌کرد ساختمان
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
  assets:
    - assets/icons/
